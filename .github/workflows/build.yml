name: Build and Push Images

on:
  release:
    types: [created]

jobs:
  build-images:
    name: Build and Push Images
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Pre-pull buildkit image (retry transient network errors)
        run: |
          for i in 1 2 3 4 5; do
            if docker pull moby/buildkit:buildx-stable-1; then
              echo "buildkit image ready (attempt $i)"
              exit 0
            fi
            echo "pull attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Failed to pull moby/buildkit:buildx-stable-1 after 5 attempts" >&2
          exit 1
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: thefnordling/cr-browser-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha,prefix=sha-
      
      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: thefnordling/cr-browser-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha,prefix=sha-
      
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=thefnordling/cr-browser-backend:latest
          cache-to: type=inline
      
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=thefnordling/cr-browser-frontend:latest
          cache-to: type=inline
      
      - name: Deploy to production
        if: github.event.release.prerelease == false
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          docker stack deploy --with-registry-auth --prune -c deploy/docker-compose.yml cr-browser
